[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claybank"
version = "0.1.0"
description = "ClayBank: personal save-and-note app for links to short video and web content"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet==1.0.5",
    "fastapi>=0.110.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["tests", "tests.*", "Docs", "Docs.*", "PrototypingFiles", "PrototypingFiles.*"]

[tool.pyrefly]
search-path = [".", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
