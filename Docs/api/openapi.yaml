openapi: 3.1.0
info:
  title: Claybank API
  version: 0.1.0
  x-contract-version: 0
  description: |
    Contract for the Claybank backend (hackathon MVP).

    Conventions (enforced by Docs/api/schemas + contract test):
    - IDs are UUIDv7 strings; times are ISO-8601 UTC with a `Z` suffix.
    - Every success body is `{"data": ...}`; every error body is
      `{"error": {"code", "message", "detail"}}`.
    - List endpoints paginate with an opaque `cursor` (request param, response field).
    - Writes accept `Idempotency-Key` (safe offline replay); capture implicitly
      also uses the canonicalized URL as a dup key and returns
      `409 already_saved` unless `force=true`.
    - This file + `schemas/*.json` are the single source for field names and
      enums; do not duplicate either in code or docs.
servers:
  - url: /v1
    description: FastAPI backend (single service, hackathon MVP)
tags:
  - name: saves
    description: Capture, reads, note, reprocessing. Capture never blocks on the network.
  - name: organization
    description: Folders, tags, suggestions, review queue (derived filter).
  - name: search-ask
    description: Hybrid search with match reasons; cited Ask answers.
  - name: sync
    description: Server-authoritative, complete-replica pull/push with idempotent replay.
paths:
  /saves:
    post:
      tags: [saves]
      summary: Capture a link (always succeeds unless input/duplicate)
      description: |
        Persists the capture record `{url, platform, source_app, captured_at, user_context}`.
        `platform` is derived from the URL host; the pipeline is enqueued but NOT awaited.
        Duplicates (canonicalized URL) return `409 already_saved` with the existing id
        unless `force=true`. The body never makes a network call.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'schemas/save-capture.json' }
      responses:
        '201':
          description: Captured (kind is `unknown` until extraction)
          content:
            application/json:
              schema: { $ref: 'schemas/save.json' }
        '409':
          description: Already saved
          content:
            application/json:
              schema: { $ref: 'schemas/error.json' }
    get:
      tags: [saves]
      summary: List saves (cursor paginated)
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: folder_id, in: query, schema: { type: string } }   # null = Inbox (omit param + inbox=true)
        - { name: inbox, in: query, schema: { type: boolean } }      # needs_review + recently added filters
        - { name: needs_review, in: query, schema: { type: boolean } }
        - { name: kind, in: query, schema: { type: string, enum: [video, article, unknown] } }
      responses:
        '200':
          description: Saves page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: 'schemas/save-page.json' }
  /saves/{save_id}:
    get:
      tags: [saves]
      summary: Read one save + its note metadata
      parameters: [ { $ref: '#/components/parameters/saveId' } ]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      save: { $ref: 'schemas/save.json' }
                      note: { $ref: 'schemas/note.json' }
                      job: { $ref: 'schemas/job.json' }
    patch:
      tags: [saves]
      summary: Update mutable save fields (folder, tags, user_context)
      parameters: [ { $ref: '#/components/parameters/idempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: 'schemas/save-patch.json' }
      responses:
        '200': { content: { application/json: { schema: { $ref: 'schemas/save.json' } } } }
        '409': { description: Stale write (updated_at predates the device copy) }
    delete:
      tags: [saves]
      summary: Delete a save and its note
      parameters: [ { $ref: '#/components/parameters/saveId' } ]
      responses: { '204': { description: Deleted } }
  /saves/{save_id}/note:
    put:
      tags: [saves]
      summary: Replace the note markdown (Markdown is source of truth)
      parameters: [ { $ref: '#/components/parameters/idempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'schemas/note-put.json' }
      responses:
        '200': { content: { application/json: { schema: { $ref: 'schemas/note.json' } } } }
        '409': { description: Conflict — banner + keep-both recovery }
  /saves/{save_id}/reprocess:
    post:
      tags: [saves]
      summary: Re-run the pipeline from a chosen stage
      description: |
        Never modifies the note body. Reruns only affect metadata, transcript and
        the folder suggestion; regeneration of body sections is a separate,
        explicit action.
      parameters:
        - { $ref: '#/components/parameters/saveId' }
        - { name: from, in: query, schema: { type: string, enum: [extracting, transcribing, analyzing, sorting] } }
        - { name: run, in: query, schema: { type: boolean, default: false }, description: 'Opt-in: process synchronously in this request (default only requeues; capture never blocks).' }
      responses: { '202': { description: Job re-queued, or finished job when run=true } }
  /folders:
    post:
      tags: [organization]
      summary: Create a folder (user action only — no auto-created folders)
      parameters: [ { $ref: '#/components/parameters/idempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'schemas/folder-write.json' }
      responses:
        '201': { content: { application/json: { schema: { $ref: 'schemas/folder.json' } } } }
        '422': { description: Would exceed depth 3 }
    get:
      tags: [organization]
      summary: List folders (cursor)
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: 'schemas/folder.json' } }
                      cursor: { type: [string, 'null'] }
  /folders/{folder_id}:
    patch:
      tags: [organization]
      summary: Rename / move / archive a folder (rename is a bulk frontmatter rewrite)
      parameters:
        - { $ref: '#/components/parameters/idempotencyKey' }
        - { name: folder_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'schemas/folder-write.json' }
      responses:
        '200': { content: { application/json: { schema: { $ref: 'schemas/folder.json' } } } }
    delete:
      tags: [organization]
      summary: Delete a folder; member saves return to the Inbox
      parameters: [ { name: folder_id, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: Deleted } }
  /saves/{save_id}/tags:
    put:
      tags: [organization]
      summary: Replace the tag set of a save (flat labels, many per save)
      parameters: [ { $ref: '#/components/parameters/saveId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'schemas/tags-put.json' }
      responses:
        '200': { content: { application/json: { schema: { $ref: 'schemas/save.json' } } } }
  /suggestions:
    get:
      tags: [organization]
      summary: Review queue = derived filter (needs_review=true); cluster proposals when present
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      review: { type: array, items: { $ref: 'schemas/save.json' } }
                      clusters: { type: array, items: { $ref: 'schemas/suggestion.json' } }
  /suggestions/accept:
    post:
      tags: [organization]
      summary: Accept a suggested folder or a cluster proposal (creates folders ONLY here)
      parameters: [ { $ref: '#/components/parameters/idempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'schemas/suggestion-accept.json' }
      responses:
        '200': { content: { application/json: { schema: { $ref: 'schemas/folder.json' } } } }
  /search:
    get:
      tags: [search-ask]
      summary: Hybrid search (FTS5 + vectors), local on device / mirrored on server
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: folder_scope, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: 'schemas/search-page.json' }
  /ask:
    post:
      tags: [search-ask]
      summary: Folder- or library-scoped Ask with mandatory citations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'schemas/ask-request.json' }
      responses:
        '200': { content: { application/json: { schema: { $ref: 'schemas/ask-answer.json' } } } }
  /sync/pull:
    get:
      tags: [sync]
      summary: Pull everything changed since a cursor (complete replica)
      parameters: [ { name: since, in: query, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: Everything changed since `since` (complete replica; no agent_trace, no vectors)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: 'schemas/sync-pull.json' }
  /sync/push:
    post:
      tags: [sync]
      summary: Replay queued offline writes (each already idempotent)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'schemas/sync-push.json' }
      responses:
        '200':
          description: Per-op results; conflicts reported as 409-equaled entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            idempotency_key: { type: string }
                            ok: { type: boolean }
                            error: { $ref: 'schemas/error.json' }
components:
  parameters:
    saveId:
      name: save_id
      in: path
      required: true
      schema: { type: string }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'Dev token for the MVP (see adr/0006): `Authorization: Bearer DEV_TOKEN`; a JWT drop-in replacement keeps the same shape.'
security:
  - bearer: []
