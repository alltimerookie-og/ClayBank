[project]
name = "claybank"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.0",
    "jsonschema>=4.26.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=1.8.0",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
tier15 = [
    "crawl4ai>=0.4.0",
]
vectors = [
    "faiss-cpu>=1.8.0,<1.12.0",
    "huggingface-hub>=0.23.0",
    "numpy>=1.26.0,<2.0.0",
    "onnxruntime>=1.18.0,<1.23.0",
    "tokenizers>=0.19.0,<0.22.0",
]
